			<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
			<script>
const banco = supabase.createClient(
		"https://cnpoethknqlrxitzokte.supabase.co",
		"sb_publishable_qn5fHfjNWyR57ROt8SySrQ_W-IB4Z2w"
	  );

document.addEventListener("DOMContentLoaded", function () {
	const params = new URLSearchParams(window.location.search);
	const dia = params.get("dia");

	document.title = dia ? `Dia ${dia}` : "Registro da piscina";
	document.getElementById("titulo").textContent =
		dia ? `Dia ${dia}` : "Nenhum dia selecionado";

	async function carregarRegistro() {
		if (!dia) return;

		const { data: registros, error } = await banco
			.from("Controle de Piscina")
			.select("*")
			.eq("dia", dia)
			.limit(1);


		if (error) {
			console.error("Erro ao buscar registro:", error);
			document.getElementById("titulo").textContent =
				"Erro ao carregar o registro";
			return;
		}

		const dados = registros?.[0];


		if (!dados) {
			document.getElementById("titulo").textContent =
				`Nenhum registro encontrado para ${dia}`;
			return;
		}

		const { data: casa, error: erroCasa } = await banco
			.from("Casas")
			.select("casa")
			.eq("id", dados.id_casa)
			.maybeSingle();

			if (erroCasa) {
			console.error("Erro ao buscar a casa:", erroCasa);
			document.getElementById("titulo").textContent =
				"Erro ao carregar a casa";
			return;
		}

		const mostrar = (valor, unidade, textoVazio) =>
			valor === null || valor === undefined || valor === ""
				? textoVazio
				: `${valor}${unidade}`;

		document.getElementById("imagem").src =
			"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSka65kV9IPeZQ8e5s3lATdqYM_XN-84ljKGS4pL6UvIQ&s=10";

		document.getElementById("ph").textContent =
			mostrar(dados.Ph, "", "Sem pH informado");
		document.getElementById("clLivre").textContent =
			mostrar(dados.clLivre, " ppm", "Sem cloro livre informado");
		document.getElementById("clCombinado").textContent =
			mostrar(dados.clComb, " ppm", "Sem cloro combinado informado");
		document.getElementById("alcalinidade").textContent =
			mostrar(dados.alcalinidade, " ppm", "Sem alcalinidade informada");
		document.getElementById("durCalc").textContent =
			mostrar(dados.durCal, " ppm", "Sem dureza cálcica informada");
		document.getElementById("acCian").textContent =
			mostrar(dados.acCian, " ppm", "Sem ácido cianúrico informado");
		document.getElementById("TDS").textContent =
			mostrar(dados.TDS, " ppm", "Sem TDS informado");
		document.getElementById("turbidez").textContent =
			mostrar(dados.turbidez, " ppm", "Sem turbidez informada");
		document.getElementById("casa").textContent =
 			 casa?.casa ?? "Casa não encontrada";

		document.getElementById("obs").textContent =
			dados.observacoes ??
			dados["observações"] ??
			dados["Observações"] ??
			"Sem observações";
	}

	carregarRegistro();

	const body = document.body;
	const btnd = document.getElementById("btndk");
	const btnl = document.getElementById("btnlg");
	const cfg = document.getElementById("btnc");
	const con = document.getElementById("cont");

	const page = location.pathname.split("/").pop();
	const key = "theme_" + page;
	const savedTheme = localStorage.getItem(key);

	if (savedTheme === "dark") {
		body.classList.add("dark-mode");
		body.classList.remove("light-mode");
	} else {
		body.classList.add("light-mode");
		body.classList.remove("dark-mode");
	}

	btnd.addEventListener("click", function () {
		body.classList.remove("light-mode");
		body.classList.add("dark-mode");
		localStorage.setItem(key, "dark");
	});

	btnl.addEventListener("click", function () {
		body.classList.remove("dark-mode");
		body.classList.add("light-mode");
		localStorage.setItem(key, "light");
	});

	cfg.addEventListener("click", function () {
		con.classList.toggle("show");
	});
});
</script>
