		async function carregarSelectCasa() {
	const select = document.getElementById("selCasa");
	select.innerHTML = '<option value="">Selecione uma casa</option>';

	const { data: registros, error } = await banco
		.from("Casas")
		.select("id, casa")

	if (error) {

		painel.textContent = `Erro ao carregar: ${error.message}`;

		option.value = registro.id;
		option.textContent =
			`${registro.casa}`;
		select.appendChild(option);
		console.log(registro)
	}
	
}
carregarSelectCasa();

		async function mostrarJogosBonito() {
			painel.innerHTML = ""; // limpa o painel
			const { data: dados, error } = await banco
				.from("Controle de Piscina")
				.select("*")
				.order("dia", { ascending: false });
			console.log(dados)
			if (error) {
				painel.textContent = `Erro ao encontrar registros, ${error}`;
				return
			}
			else if (dados.length == 0) {
				painel.textContent = `Sem registros`;
				return
			}
			else {
			for (const piscina of dados) {
				const { data: casas} = await banco
					.from("Casas")
					.select("casa")
					.eq("id", piscina.id_casa)

				painel.innerHTML += `
					<p>
						<strong>${piscina.dia}</strong><br>
						ph: ${piscina.Ph}<br>
						clCombinado: ${piscina.clComb}<br>
						clLivre: ${piscina.clLivre}<br>
						alcalinidade: ${piscina.alcalinidade}<br>
						durCalc: ${piscina.durCal}<br>
						acCian: ${piscina.acCian}<br>	
						TDS: ${piscina.TDS}<br>
						turbidez: ${piscina.turbidez}<br>
						casa: ${casas[0]["casa"]}<br>
						Criado por: ${piscina.usuario}<br>
					</p>
					<hr>
				`;
			}
		}
		}
		mostrarJogosBonito()
		
		
		function cleanInput() {
		  document.getElementById('dia').value = '';
		  document.getElementById('ph').value = 'nulo';
		  document.getElementById('clCombinado').value = '';
		  document.getElementById('clLivre').value = '';
		  document.getElementById('alcalinidade').value = '';
		  document.getElementById('durCalc').value = '';
		  document.getElementById('obs').value = '';
		}
		function adicionarJogo(dia, ph, clCombinado, acCian, alcalinidade, durCalc, clLivre, TDS, turbidez, obs, casa) {
		  if (jogos[dia]) {
			console.log(`'${dia}' já registrado. Atualizando dados...`);
			

		  } else {
			console.log(`Adicionando '${dia}' à biblioteca...`);
		  }

		  // Em JS criamos as propriedades diretamente no objeto
		  jogos[dia] = {
			ph: ph,
			clCombinado: clCombinado,
			clLivre: clLivre,
			alcalinidade: alcalinidade,
			durCalc: durCalc,
			acCian: acCian,
			TDS: TDS,
			turbidez: turbidez,
			obs: obs,
			casa: casa
		  };
			localStorage.setItem("bibliotecaDias", JSON.stringify(jogos));
		}
		
		
		function excluirJogos(dia) {
		if (jogos[dia]) {
			delete jogos[dia]
			console.log('Jogo removido com sucesso')
			localStorage.setItem("bibliotecaDias", JSON.stringify(jogos));

		}
		else {
			console.log('Jogo não encontrado, deseja adiciona-lo?')
		}
		}
		
		function pegarValores() {
		let dia = document.getElementById('dia').value;
		let ph = document.getElementById('ph').value;
		let clCombinado = document.getElementById('clCombinado').value;
		let clLivre = document.getElementById('clLivre').value;
		let alcalinidade = document.getElementById('alcalinidade').value;
		let durCalc = document.getElementById('durCalc').value;
		let acCian = document.getElementById('acCian').value;
		let TDS = document.getElementById('TDS').value;
		let turbidez = document.getElementById('turbidez').value;
		let obs = document.getElementById('obs').value;
		let casa = document.getElementById('selCasa').value;
		//let Img = document.getElementById('img').value;
		//let Sta = document.getElementById('sta').value;
		let valoresBrutos = {
		jogo: dia,
		ph: ph,
		desenvolvedora: clCombinado,
		clLivre: clLivre,
		//status: Sta,
		alcalinidade: alcalinidade,
		durCalc: durCalc,
		acCian: acCian,
		TDS: TDS,
		turbidez: turbidez,
		obs: obs,
		casa: casa
		//img: Img
		}
		let valores = {}
		let listateste = [dia, ph, clCombinado, acCian, alcalinidade, durCalc, clLivre, TDS, turbidez, obs, casa];
		for (let [item, valor] of Object.entries(valoresBrutos)) {
			if (valor !== ''){
			valores[item] = "Preenchido"
			}
			else {
			valores[item] = "Vazio"
			}
		}
		return {
			valores,
			listateste
		}
		}
		
		adicionar.addEventListener('click', async function() {
		  const resultado = pegarValores();
		  const valores = resultado.valores;
		  const lista = resultado.listateste;

		  const [dia, ph, clCombinado, acCian, alcalinidade, durCal, clLivre, TDS, turbidez, observacoes, id_casa] = lista;

		  if (!dia || !id_casa) {
			painel.textContent = "Selecione a casa";
			return;
		  }

		  const numero = valor =>
			valor === "" ? null : Number(String(valor).replace(",", "."));

		  const registro = {
			usuario: localStorage.getItem("loginEfetuado") || "visitante",
			dia: dia,
			Ph: numero(ph),
			clLivre: numero(clLivre),
			clComb: numero(clCombinado),
			durCal: numero(durCal),
			alcalinidade: numero(alcalinidade),
			acCian: numero(acCian),
			TDS: numero(TDS),
			turbidez: numero(turbidez),
			observacoes: observacoes || null,
			id_casa: id_casa || null
		  };

		  const idSelecionado = registroSelecionadoId;
			const atualizando = idSelecionado !== null;

			// Ao atualizar, preserva quem criou o registro.
			const { usuario, ...camposDoRegistro } = registro;

			const respostaBanco = atualizando
				? await banco
					.from("Controle de Piscina")
					.update(camposDoRegistro)
					.eq("Usuário", idSelecionado)
					.eq("id_casa", id_casa)
				: await banco
					.from("Controle de Piscina")
					.insert(registro);

			if (respostaBanco.error) {
				console.error(respostaBanco.error);
				painel.textContent = `Erro ao salvar: ${respostaBanco.error.message}`;
				return;
			}

			painel.textContent = atualizando
				? `Registro de ${dia} atualizado.`
				: `Registro de ${dia} adicionado.`;

			registroSelecionadoId = null;
			document.getElementById("sel").value = "";
			cleanInput();
			await carregarSelect();
			});

		
		excluir.addEventListener("click", async function () {
			const dia = document.getElementById("dia").value;

			if (!dia) {
				painel.textContent = "Selecione o dia que deseja excluir.";
				return;
			}

			if (!confirm(`Excluir do banco todos os registros do dia ${dia}?`)) return;

			const { data, error } = await banco
				.from("Controle de Piscina")
				.delete()
				.eq("dia", dia)
				.select("dia");

			if (error) {
				console.error(error);
				painel.textContent = `Erro ao excluir: ${error.message}`;
				return;
			}

			painel.textContent = data.length
				? `Registro(s) do dia ${dia} excluído(s).`
				: "Nada foi excluído. Pode estar faltando permissão de exclusão no Supabase.";

			cleanInput();
		});
		exibir.addEventListener('click', mostrarJogosBonito);
		limpar.addEventListener("click", async function () {
			if (!confirm("Tem certeza que deseja apagar todos os registros do banco?")) return;

			const { data, error } = await banco
				.from("Controle de Piscina")
				.delete()
				.not("dia", "is", null)
				.select("dia");

			if (error) {
				console.error(error);
				painel.textContent = `Erro ao limpar a lista: ${error.message}`;
				return;
			}

			painel.textContent = `${data.length} registro(s) removido(s) do banco.`;
			cleanInput();
		});
let registroSelecionadoId = null;



async function carregarSelect() {
	const select = document.getElementById("sel");
	select.innerHTML = '<option value="">Selecione um registro</option>';

	const { data: registros, error } = await banco
		.from("Controle de Piscina")
		.select("*")
		.order("dia", { ascending: false });

	if (error) {
		console.error("Erro ao carregar registros:", error);
		painel.textContent = `Erro ao carregar: ${error.message}`;
		return;
	}

	for (const registro of registros) {
		const option = document.createElement("option");
		option.value = registro["Usuário"];
		option.textContent =
			`${registro.dia} — ${registro.usuario ?? "usuário"}`;
		select.appendChild(option);
	}
}

document.getElementById("sel").addEventListener("change", async function () {
	const id = Number(this.value);

	if (!id) {
		registroSelecionadoId = null;
		return;
	}

	const { data: registro, error } = await banco
		.from("Controle de Piscina")
		.select("*")
		.eq("Usuário", id)
		.maybeSingle();

	if (error || !registro) {
		console.error("Erro ao abrir registro:", error);
		painel.textContent = "Não foi possível carregar esse registro.";
		return;
	}

	registroSelecionadoId = id;

	document.getElementById("dia").value = registro.dia ?? "";
	document.getElementById("ph").value = registro.Ph ?? "";
	document.getElementById("clLivre").value = registro.clLivre ?? "";
	document.getElementById("clCombinado").value = registro.clComb ?? "";
	document.getElementById("alcalinidade").value = registro.alcalinidade ?? "";
	document.getElementById("durCalc").value = registro.durCal ?? "";
	document.getElementById("acCian").value = registro.acCian ?? "";
	document.getElementById("TDS").value = registro.TDS ?? "";
	document.getElementById("turbidez").value = registro.turbidez ?? "";
	document.getElementById("selCasa").value = registro.id_casa ?? "";
	document.getElementById("obs").value =
		registro.observacoes ?? registro["observações"] ?? "";
});

carregarSelect();





console.log(loginEfetuado);
