	<body>
	<h1 class="bar"><a style="color: var(--tx-color1);" href="Página_Principal.html"><div class="bib" >Controle Piscina</div></a></h1>
	<h1 class="title"> Adicionar/ Atualizar/ Remover Dia da Biblioteca</h1>	
	<div class="container">
	<p>Não é necessário que todas as informações sejam preenchidas para adicionar um dia, é possivel apenas colocar aquilo que voce deseja e, se preciso, é possivel adicionar depois</p>
		<label for="dia">Selecione o dia:</label>
		<input type="date" id="dia"><br>
		<label for="ph">Digite o Ph medido:</label>
		<input type="text" id="ph" placeholder="Digite o Ph medido"><br>
		<!--<div style="display: flex; flex-direction: column;">
		<select id="sta" style="padding: 30px; background-color: black; color: var(--tx-color1);border-radius: 13px; cursor: pointer;margin: 20px;width: 200px;">
		<option value="nulo">Selecione um status:</option>
		<option id="zer">Zerado</option>
		<option id="jog">jogando</option>
		<option id="nun">Nunca Joguei</option>
		</select><br>
		</div>-->
		<label for="clLivre">Digite o Cloro livre medido:</label>
		<input type="number" id="clLivre" placeholder="Digite o Cloro livre"><br>
		<label for="clCombinado">Digite o Cloro combinado medido:</label>
		<input type="text" id="clCombinado" placeholder="Digite o Cloro combinado"><br>		
		<label for="alcalinidade">Digite a Acalinidade total medida:</label>
		<input type="number" id="alcalinidade" placeholder="Digite a Alcanilinidade total"><br>
		<label for="durCalc">Digite a Dureza cálcica medida:</label>
		<input type="number" id="durCalc" placeholder="Digite a Dureza cálcica"><br>
		
		<!--Novas infomações!!-->
		
		<label for="acCian">Digite o Ácido cianúrico medido:</label>
		<input type="number" id="acCian" placeholder="Digite o Ácido cianúrico"><br>
		<label for="TDS">Digite o TDS medido:</label>
		<input type="number" id="TDS" placeholder="Digite o TDS"><br>
		<label for="turbidez">Digite a Turbidez medida:</label>
		<input type="number" id="turbidez" placeholder="Digite a Turbidez"><br>
		<label for="obs">Digite a Observações realizadas:</label>
		<input type="text" id="obs" placeholder="Digite as Observações"><br>
		
		<!--Novas infomações!-->
		
		
		<!--<label for="img">Selecione uma imagem para o jogo:</label>
		<input type="text" id="img" placeholder="Digite o codigo da imagem"><br>-->
		<select id="sel" style="padding: 30px; background-color: black; color: var(--tx-color1);border-radius: 13px; cursor: pointer;">
		</select>
		<div class="buttons" >
			<button class="cards" style="margin-left: 20px; background-color: #314c53;width: 150px;color: var(--tx-color1); padding: 20px; border: 4px var(--tx-color1) solid;" id="add">Adicionar/atualizar</button>
			<button class="cards" style="margin-left: 20px; background-color: #314c53; padding: 20px;color: var(--tx-color1); border: 4px var(--tx-color1) solid;" id="exc" >Excluir</button>
			<button class="cards" style="margin-left: 20px; background-color: #314c53;color: var(--tx-color1); padding: 20px; border: 4px var(--tx-color1) solid;" id="exi" >Exibir</button>
			<button class="cards" style="margin-left: 20px; background-color: #314c53;color: var(--tx-color1); padding: 20px; border: 4px var(--tx-color1) solid;" id="limp" >Limpar lista</button>
			<button class="cards" style="margin-left: 20px; background-color: #314c53;color: var(--tx-color1); padding: 20px; border: 4px var(--tx-color1) solid;" id="show" >Mostrar Cards</button>
		</div>
		<p class="panel" style="padding: 70px;color: var(--tx-color1);" id="painel"></p>
	</div>
	<script>		
		let jogos = JSON.parse(localStorage.getItem("bibliotecaDias")) || {};
		document.getElementById('dia').value = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
		let adicionar = document.getElementById('add')
		let atualizar = document.getElementById('atu')
		let excluir = document.getElementById('exc')
		let exibir = document.getElementById('exi')
		let limpar = document.getElementById('limp')
		let salvar = document.getElementById('sal')
		let mostrar = document.getElementById('show')
		let painel = document.getElementById('painel')
		let situação_atual = 'nulo'
		// Criamos o objeto vazio
		


		function mostrarJogosBonito() {
			painel.innerHTML = ""; // limpa o painel

			for (let [dia, dados] of Object.entries(jogos)) {
				painel.innerHTML += `
					<p>
						<strong>${dia}</strong><br>
						ph: ${dados.ph}<br>
						clCombinado: ${dados.clCombinado}<br>
						clLivre: ${dados.clLivre}<br>
						alcalinidade: ${dados.alcalinidade}<br>
						durCalc: ${dados.durCalc}<br>
						acCian: ${dados.acCian}<br>	
						TDS: ${dados.TDS}<br>
						turbidez: ${dados.turbidez}
					</p>
					<hr>
				`;
			}
		}
		
		
		function cleanInput() {
			document.getElementById('dia').value = '';
		  document.getElementById('ph').value = 'nulo';
		  document.getElementById('clCombinado').value = '';
		  document.getElementById('clLivre').value = '';
		  document.getElementById('alcalinidade').value = '';
		  document.getElementById('durCalc').value = '';
		  document.getElementById('obs').value = '';
		}
		function adicionarJogo(dia, ph, clCombinado, acCian, alcalinidade, durCalc, clLivre, TDS, turbidez, obs) {
		  if (jogos[dia]) {
			console.log(`'${dia}' já registrado. Atualizando dados...`);
			

		  } else {
			console.log(`Adicionando '${dia}' à biblioteca...`);
		  }

		  // Em JS criamos as propriedades diretamente no objeto
		  jogos[dia] = {
			ph: ph,
			clCombinado: clCombinado,
			clLivre: clLivre,
			alcalinidade: alcalinidade,
			durCalc: durCalc,
			acCian: acCian,
			TDS: TDS,
			turbidez: turbidez,
			obs: obs
		  };
			localStorage.setItem("bibliotecaDias", JSON.stringify(jogos));
		}
		
		
		function excluirJogos(dia) {
		if (jogos[dia]) {
			delete jogos[dia]
			console.log('Jogo removido com sucesso')
			localStorage.setItem("bibliotecaDias", JSON.stringify(jogos));

		}
		else {
			console.log('Jogo não encontrado, deseja adiciona-lo?')
		}
		}
		
		function pegarValores() {
		let dia = document.getElementById('dia').value;
		let ph = document.getElementById('ph').value;
		let clCombinado = document.getElementById('clCombinado').value;
		let clLivre = document.getElementById('clLivre').value;
		let alcalinidade = document.getElementById('alcalinidade').value;
		let durCalc = document.getElementById('durCalc').value;
		let acCian = document.getElementById('acCian').value;
		let TDS = document.getElementById('TDS').value;
		let turbidez = document.getElementById('turbidez').value;
		let obs = document.getElementById('obs').value;
		//let Img = document.getElementById('img').value;
		//let Sta = document.getElementById('sta').value;
		let valoresBrutos = {
		jogo: dia,
		ph: ph,
		desenvolvedora: clCombinado,
		clLivre: clLivre,
		//status: Sta,
		alcalinidade: alcalinidade,
		durCalc: durCalc,
		acCian: acCian,
		TDS: TDS,
		turbidez: turbidez,
		obs: obs
		//img: Img
		}
		let valores = {}
		let listateste = [dia, ph, clCombinado, acCian, alcalinidade, durCalc, clLivre, TDS, turbidez, obs];
		for (let [item, valor] of Object.entries(valoresBrutos)) {
			if (valor !== ''){
			valores[item] = "Preenchido"
			}
			else {
			valores[item] = "Vazio"
			}
		}
		return {
			valores,
			listateste
		}
		}
		
		adicionar.addEventListener('click', function() {
		let dia = document.getElementById('dia').value;
		let resultado = pegarValores();   
		let valores = resultado.valores;  
		console.log(valores)
		let lista = resultado.listateste; 
		let preenchidos = []
		let faltantes = []
		for (let [campo, valor] of Object.entries(valores)) {
			if (valor == "Preenchido") {
				preenchidos.push(campo);
			} 
			else {
				faltantes.push(campo);
			}
		}

		console.log(preenchidos)
		console.log(faltantes)
		adicionarJogo(...lista)
		painel.innerHTML = `Informações para ${dia} Adicionadas <br> Informações faltantes para ${dia}: ${faltantes.join(", ")}`;
		cleanInput()
		});

		
		excluir.addEventListener('click', function() {
		let dia = document.getElementById('dia').value;
		let ph = document.getElementById('ph').value;
		let clCombinado = document.getElementById('clCombinado').value;
		let clLivre = document.getElementById('clLivre').value;
		let alcalinidade = document.getElementById('alcalinidade').value;
		let durCalc = document.getElementById('durCalc').value;
		let acCian = document.getElementById('acCian').value;
		let TDS = document.getElementById('TDS').value;
		let turbidez = document.getElementById('turbidez').value;
		let obs = document.getElementById('obs').value;
		if (dia !== '') {
			excluirJogos(dia);
			console.log('Dia excluído com sucesso!')
			console.log(jogos);
			painel.textContent = `Dados do dia ${dia} excluído com sucesso!`
			cleanInput()
		}
		});
		exibir.addEventListener('click', mostrarJogosBonito);
		limpar.addEventListener('click', function () {
    localStorage.removeItem("bibliotecaDias");
    alert("Biblioteca limpa!");
    location.reload(); 
});
	mostrar.addEventListener('click', () => location.reload());
function carregarSelect() {
    const jogos = JSON.parse(localStorage.getItem("bibliotecaDias")) || {}; // <-- aqui
    const select = document.getElementById("sel");

    select.innerHTML = '<option value="">Preencher automaticamente</option>';

    for (let [dia, dados] of Object.entries(jogos)) {
        const option = document.createElement("option");
        option.value = dia;
        option.textContent = dia;
        select.appendChild(option);
    }
}



carregarSelect();

document.getElementById("sel").addEventListener("change", function() {
    const diaSelecionado = this.value;
    const jogos = JSON.parse(localStorage.getItem("bibliotecaDias")) || {}; // <-- aqui

    const dados = jogos[diaSelecionado];

    if (dados) {
        document.getElementById("dia").value = diaSelecionado;
        document.getElementById("acCian").value = dados.acCian;
        document.getElementById("ph").value = dados.ph;
        document.getElementById("alcalinidade").value = dados.alcalinidade;
        document.getElementById("durCalc").value = dados.durCalc;
        document.getElementById("clLivre").value = dados.clLivre;
        document.getElementById("clCombinado").value = dados.clCombinado;
		document.getElementById("TDS").value = dados.TDS;
		document.getElementById("turbidez").value = dados.turbidez;
		document.getElementById("obs").value = dados.obs;
    }
});



function mostrarJogosComoCards() {
    painel.innerHTML = "";

    let container = document.createElement("div");
    container.className = "linha-jogos";

    for (let [dia, dados] of Object.entries(jogos)) {

        // contêiner externo que agrupa dia + card
        let jogoContainer = document.createElement("div");
        jogoContainer.className = "jogo-container";


        let diaDiv = document.createElement("div");
        diaDiv.className = "dia-jogo";
        diaDiv.textContent = dia;


        let card = document.createElement("button");
        card.className = "card-jogo";

       card.innerHTML = `
    <img src="${dados.codigo}" class="imagem-real">
`;

		card.addEventListener("click", function() {
			window.location.href = `Controle_dia.html?dia=${encodeURIComponent(dia)}`;
		});

        // montar estrutura
        jogoContainer.appendChild(diaDiv);
        jogoContainer.appendChild(card);

        container.appendChild(jogoContainer);
    }

    painel.appendChild(container);
}


mostrarJogosComoCards()
		console.log(jogos)
	</script>
